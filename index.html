<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Dinamiği: Akademik Simülasyon</title>
    <!-- Plotly.js for Charts -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
        }

        /* Glassmorphism Panels */
        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1, h2, h3 {
            margin-bottom: 1rem;
            font-weight: 800;
        }

        h1 {
            font-size: 1.8rem;
            background: -webkit-linear-gradient(45deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        /* Sliders / Controls */
        .control-group {
            margin-bottom: 1.5rem;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .val-display {
            color: var(--primary);
            font-weight: 800;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px var(--primary);
            transition: transform 0.2s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            margin-top: 1rem;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--primary);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        /* Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .metric-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 800;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s;
        }

        /* Chart Container */
        .chart-container {
            width: 100%;
            height: 400px;
            margin-top: 2rem;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="panel">
        <h1>🎓 Sistem Dinamiği</h1>
        <p>4 Yıllık Akademik Hayat Simülasyonu. Kontrolleri ayarlayın ve başlatın.</p>

        <h3>🎛️ Temel Kontrol Paneli</h3>
        
        <div class="control-group">
            <label>Günlük Uyku Süresi <span class="val-display" id="val-sleep">7.0 Saat</span></label>
            <input type="range" id="sleep_hours" min="4" max="10" step="0.5" value="7">
        </div>

        <div class="control-group">
            <label>Haftalık Sosyal Zaman <span class="val-display" id="val-social">10 Saat</span></label>
            <input type="range" id="social_hours" min="0" max="40" step="1" value="10">
        </div>

        <div class="control-group">
            <label>Sınav Çalışma Stratejisi <span class="val-display" id="val-cram">3 Gün Kala</span></label>
            <input type="range" id="cram_days" min="1" max="14" step="1" value="3">
        </div>

        <h3 style="margin-top:2rem;">⚙️ Gelişmiş Faktörler</h3>
        
        <div class="control-group">
            <label>Yarı Zamanlı İş <span class="val-display" id="val-job">0 Saat</span></label>
            <input type="range" id="part_time_hours" min="0" max="30" step="1" value="0">
        </div>

        <div class="control-group">
            <label>Günlük Kafein (Kahve) <span class="val-display" id="val-caf">1 Fincan</span></label>
            <input type="range" id="caffeine_cups" min="0" max="10" step="1" value="1">
        </div>

        <button class="btn" onclick="runSimulation()">🚀 Simülasyonu Başlat</button>
        <button class="btn btn-secondary" onclick="downloadCSV()" id="btn-download" style="display:none;">💾 CSV Olarak İndir</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="panel" id="dashboard" style="opacity: 0.5; pointer-events: none; transition: opacity 0.5s;">
        <h2>📊 Analiz Sonuçları</h2>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Tahmini Mezuniyet GPA</div>
                <div class="metric-value" id="res-gpa" style="color: var(--primary);">0.00</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Ortalama Tükenmişlik</div>
                <div class="metric-value" id="res-burnout" style="color: var(--warning);">%0</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Mezuniyet Olasılığı</div>
                <div class="metric-value" id="res-prob" style="color: var(--success);">%0</div>
            </div>
        </div>

        <p>Mezuniyet İlerlemesi</p>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="chart-container" id="chart-gpa-burnout"></div>
        <div class="chart-container" id="chart-scatter"></div>
    </div>

    <script>
        // --- UI Updates ---
        const ids = ["sleep_hours", "social_hours", "cram_days", "part_time_hours", "caffeine_cups"];
        const units = ["Saat", "Saat", "Gün Kala", "Saat", "Fincan"];
        const vals = ["val-sleep", "val-social", "val-cram", "val-job", "val-caf"];

        ids.forEach((id, index) => {
            document.getElementById(id).addEventListener('input', function(e) {
                document.getElementById(vals[index]).innerText = e.target.value + " " + units[index];
            });
        });

        // --- MATH & STATS UTILS ---
        function randomNormal(mean=0, stdev=10) {
            const u = 1 - Math.random();
            const v = Math.random();
            const z = Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
            return z * stdev + mean;
        }

        function calculateGrade(score) {
            if (score >= 90) return {letter: "AA", points: 4.0};
            if (score >= 85) return {letter: "BA", points: 3.5};
            if (score >= 80) return {letter: "BB", points: 3.0};
            if (score >= 75) return {letter: "CB", points: 2.5};
            if (score >= 70) return {letter: "CC", points: 2.0};
            if (score >= 60) return {letter: "DC", points: 1.5};
            if (score >= 50) return {letter: "DD", points: 1.0};
            if (score >= 40) return {letter: "FD", points: 0.5};
            return {letter: "FF", points: 0.0};
        }

        // Global data storage for CSV
        let simHistoryData = [];

        // --- SIMULATION ENGINE ---
        function runSimulation() {
            // Get inputs
            const sleep = parseFloat(document.getElementById('sleep_hours').value);
            const social = parseInt(document.getElementById('social_hours').value);
            const cram = parseInt(document.getElementById('cram_days').value);
            const job = parseInt(document.getElementById('part_time_hours').value);
            const caf = parseInt(document.getElementById('caffeine_cups').value);

            let motivation = 100;
            let cum_fatigue = 0;
            let history = [];
            let examResults = [];

            simHistoryData = [["Gun", "Donem", "Uyku_Saati", "Calisma_Saati", "Anlik_Motivasyon", "Kumulatif_Yorgunluk", "Tukenmislik"]];

            // 8 Semesters
            for (let sem = 1; sem <= 8; sem++) {
                // Generate 5 courses
                let courses = [];
                for (let c = 1; c <= 5; c++) {
                    courses.push({
                        name: `Ders ${sem}0${c}`,
                        difficulty: 0.8 + Math.random() * 0.4,
                        knowledge: 0, midterm: 0, final: 0
                    });
                }

                // 98 Days per semester
                for (let day = 1; day <= 98; day++) {
                    let global_day = (sem - 1) * 98 + day;

                    // Caffeine & Job logic
                    let caf_boost = Math.min(0.3, caf * 0.05);
                    let caf_crash = caf * 0.8;

                    // Sleep deficit
                    let deficit = Math.max(0, 7 - sleep) + (caf_crash / 2);
                    cum_fatigue += deficit * 2.5;
                    
                    // Job exhaustion
                    cum_fatigue += (job / 7) * 1.5;
                    cum_fatigue = Math.min(100, Math.max(0, cum_fatigue));

                    // Efficiency
                    let efficiency = Math.exp(-0.05 * cum_fatigue) + caf_boost;
                    efficiency = Math.min(1.0, Math.max(0.0, efficiency));

                    // Motivation logic
                    let mot_change = 0;
                    if (social < 5) mot_change -= 1.5;
                    else if (social <= 15) mot_change += 1.0;
                    else mot_change -= 0.5;

                    if (job > 20) mot_change -= 1.0;
                    else if (job > 0 && job <= 15) mot_change += 0.2;

                    motivation += mot_change;
                    motivation = Math.min(100, Math.max(0, motivation));
                    let burnout = 100 - motivation;

                    // Attendance Risk
                    let att_penalty = 1.0;
                    if (cum_fatigue > 85) att_penalty = 0.5;
                    if (cum_fatigue > 95) att_penalty = 0.2;

                    // Cramming
                    let isCramming = (49 - cram <= day && day < 49) || (98 - cram <= day && day < 98);
                    let baseStudy = isCramming ? 6 : 2;

                    let available_time_ratio = Math.max(0, (24 - sleep - (job/7) - 4) / 10);
                    let study_hours = baseStudy * (motivation / 100) * available_time_ratio * att_penalty;

                    // Course loop
                    courses.forEach(course => {
                        let learning = (study_hours / 5) * efficiency / course.difficulty;
                        course.knowledge += learning * 3.5;
                        course.knowledge = Math.min(100, course.knowledge);

                        // Midterm (Day 49)
                        if (day === 49) {
                            let score = course.knowledge * 0.8 + randomNormal() - (cum_fatigue * 0.2);
                            course.midterm = Math.min(100, Math.max(0, score));
                        }

                        // Final (Day 98)
                        if (day === 98) {
                            let score = course.knowledge * 0.8 + randomNormal() - (cum_fatigue * 0.2);
                            course.final = Math.min(100, Math.max(0, score));

                            let finalGrade = course.midterm * 0.4 + course.final * 0.6;
                            let gradeInfo = calculateGrade(finalGrade);

                            examResults.push({
                                sem: sem,
                                name: course.name,
                                finalGrade: finalGrade,
                                points: gradeInfo.points,
                                letter: gradeInfo.letter,
                                sleep_dep: cum_fatigue
                            });
                        }
                    });

                    // Recovery
                    if (sleep > 7) {
                        cum_fatigue -= (sleep - 7) * 2;
                        cum_fatigue = Math.max(0, cum_fatigue);
                    }

                    // Save history
                    history.push({sem, burnout});
                    simHistoryData.push([global_day, sem, sleep, study_hours.toFixed(2), motivation.toFixed(2), cum_fatigue.toFixed(2), burnout.toFixed(2)]);
                }
            }

            // Calculations
            let totalPoints = 0;
            let passedCount = 0;
            examResults.forEach(ex => {
                totalPoints += ex.points;
                if (ex.points >= 1.0) passedCount++;
            });

            let gpa = totalPoints / examResults.length;
            let gradProb = (passedCount / examResults.length) * 100;
            
            let totalBurnout = 0;
            history.forEach(h => totalBurnout += h.burnout);
            let avgBurnout = totalBurnout / history.length;

            // Update UI
            document.getElementById("dashboard").style.opacity = "1";
            document.getElementById("dashboard").style.pointerEvents = "auto";
            document.getElementById("btn-download").style.display = "block";

            document.getElementById("res-gpa").innerText = gpa.toFixed(2);
            document.getElementById("res-burnout").innerText = "%" + avgBurnout.toFixed(0);
            document.getElementById("res-prob").innerText = "%" + gradProb.toFixed(0);

            // Progress Bar Color Logic
            let pBar = document.getElementById("progress-bar");
            pBar.style.width = gradProb + "%";
            if (gradProb >= 80) pBar.style.backgroundColor = "var(--success)";
            else if (gradProb >= 50) pBar.style.backgroundColor = "var(--warning)";
            else pBar.style.backgroundColor = "var(--danger)";

            drawCharts(history, examResults);
        }

        // --- CHARTS ---
        function drawCharts(history, examResults) {
            // Aggregate history by semester for Line Chart
            let semBurnout = [0,0,0,0,0,0,0,0];
            history.forEach(h => semBurnout[h.sem-1] += h.burnout / 98);

            let semGpa = [0,0,0,0,0,0,0,0];
            let counts = [0,0,0,0,0,0,0,0];
            examResults.forEach(ex => {
                semGpa[ex.sem-1] += ex.points * 25; // Scale GPA to 100
                counts[ex.sem-1]++;
            });
            for(let i=0; i<8; i++) semGpa[i] /= counts[i];

            let trace1 = {
                x: [1,2,3,4,5,6,7,8],
                y: semBurnout,
                name: 'Tükenmişlik (%)',
                type: 'scatter',
                line: {color: '#ef4444', width: 3}
            };
            let trace2 = {
                x: [1,2,3,4,5,6,7,8],
                y: semGpa,
                name: 'Dönemlik GPA (100 Üzerinden)',
                type: 'scatter',
                line: {color: '#3b82f6', width: 3}
            };

            let layout1 = {
                title: '4 Yıl Boyunca Tükenmişlik ve GPA',
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: {color: '#f8fafc'},
                xaxis: {title: 'Dönem'},
                yaxis: {title: 'Seviye (0-100)'}
            };

            Plotly.newPlot('chart-gpa-burnout', [trace1, trace2], layout1, {responsive: true});

            // Scatter Plot for Sleep vs Grade
            let scatterX = examResults.map(e => e.sleep_dep);
            let scatterY = examResults.map(e => e.finalGrade);
            let scatterText = examResults.map(e => e.letter);

            let trace3 = {
                x: scatterX,
                y: scatterY,
                mode: 'markers',
                type: 'scatter',
                text: scatterText,
                marker: { size: 8, color: '#c084fc', opacity: 0.7 }
            };

            let layout2 = {
                title: 'Uyku Yoksunluğu ve Sınav Başarısı',
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: {color: '#f8fafc'},
                xaxis: {title: 'Sınav Günü Kümülatif Yorgunluk'},
                yaxis: {title: 'Sınav Notu (0-100)'}
            };

            Plotly.newPlot('chart-scatter', [trace3], layout2, {responsive: true});
        }

        function downloadCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            simHistoryData.forEach(rowArray => {
                let row = rowArray.join(",");
                csvContent += row + "\r\n";
            });
            var encodedUri = encodeURI(csvContent);
            var link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "academic_sim_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
